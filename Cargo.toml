[workspace]
resolver = "2"
members = [
    "crates/ipc-protocol",
    "crates/agent-core",
    "crates/windows-agent",
    "crates/windows-session",
    "crates/screen-time",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
publish = false
license = "LicenseRef-Proprietary"

[workspace.dependencies]
ipc-protocol = { path = "crates/ipc-protocol" }
agent-core = { path = "crates/agent-core" }
screen-time = { path = "crates/screen-time" }
# SQLite derleme sırasında kaynak koddan gömülür: hedef makinede DLL gerekmez.
rusqlite = { version = "0.41.1", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
ctrlc = "3.5.2"
libc = "0.2.191"
windows-service = "0.8.1"
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_LibraryLoader",
    "Win32_System_Pipes",
    "Win32_System_Com",
    "Win32_System_RemoteDesktop",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_System_Time",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
