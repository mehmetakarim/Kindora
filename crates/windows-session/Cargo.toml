[package]
name = "windows-session"
description = "Kindora Session Helper (P1.A prototype): user-session process talking to the agent over local IPC"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[[bin]]
name = "kindora-helper"
path = "src/main.rs"

[dependencies]
ipc-protocol.workspace = true
serde_json.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true
# Windows'ta konsol olayları kendi işleyicimizle (console_ctrl.rs, OBS-011).
ctrlc.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys.workspace = true
