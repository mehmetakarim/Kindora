# Kindora P1A — Windows x64 CI build, test paketi ve isteğe bağlı prerelease.
#
# - push (main): derle + test + clippy + release EXE + paket → yalnız Actions artifact.
# - workflow_dispatch: aynısı; `publish_prerelease: true` ise AYNI çalıştırmanın
#   doğrulanmış artifact'ı prerelease olarak yayımlanır (yeniden derleme yok).
# - Üçüncü taraf eylem yok; yalnız GitHub'ın resmi eylemleri, commit SHA ile sabit.
# - GitHub-hosted runner testleri gerçek Windows 11 Home/Pro kabul testi DEĞİLDİR.

name: windows-p1a

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish_prerelease:
        description: "Başarılı derlemenin paketini prerelease olarak yayımla (Not for Production)"
        type: boolean
        default: false
      release_tag:
        description: "Prerelease etiketi (biçim: p1a-windows-test.N)"
        type: string
        default: "p1a-windows-test.2"

permissions:
  contents: read

concurrency:
  group: windows-p1a-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: "1.94.0"
  PACKAGE_NAME: Kindora-P1A-Windows-x64

jobs:
  build:
    name: Windows x64 — build, test, package
    runs-on: windows-2022
    timeout-minutes: 45
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Rust toolchain (rustup, sabit sürüm)
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component clippy,rustfmt --target x86_64-pc-windows-msvc
          rustup default "$RUST_TOOLCHAIN"
          rustc -Vv
          cargo -V

      - name: Runner ortamı
        shell: pwsh
        run: |
          Get-CimInstance Win32_OperatingSystem | Select-Object Caption, Version, OSArchitecture | Format-List
          whoami
          "SessionId: $((Get-Process -Id $PID).SessionId)"

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: cargo check
        run: cargo check --workspace --all-targets --locked

      # Süreç düzeyi testler diğer paketin ikilisini (kindora-helper.exe) kullanır;
      # `cargo test` onu derlemez. Bayat/eksik ikiliyle test etmemek için önce derle.
      - name: cargo build (debug, test ikilileri)
        run: cargo build --workspace --locked

      - name: cargo test
        run: |
          mkdir -p dist
          cargo test --workspace --locked -- --nocapture 2>&1 | tee dist/test-output.txt
          grep -E "^test result:|Running |MEASURE " dist/test-output.txt > dist/ci-test-summary.txt
          echo "---- özet ----"
          cat dist/ci-test-summary.txt

      - name: cargo clippy (-D warnings)
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Release build
        run: cargo build --release --workspace --locked

      # BUG-003: release EXE'leri gerçek bir LocalService servisi olarak, test
      # rehberindeki komutlarla (Windows PowerShell 5.1) kurulur ve helper kimliği
      # uçtan uca doğrulanır; servis her durumda silinir. Runner hesabı yönetici
      # olduğundan standart kullanıcı testlerinin (W-03, W-08) yerine geçmez.
      - name: LocalService servis uçtan uca (W-07/W-10 CI kapsamı)
        shell: pwsh
        run: |
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File ci/p1a-localservice-e2e.ps1 -BinDir target/release -SummaryFile dist/ci-test-summary.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Paketle ve SHA-256
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # Metin dosyaları LF ile yazılır: CRLF, Linux/macOS `sha256sum -c` ile
          # dosya adını "<ad>\r" olarak okutur ve doğrulama başarısız olur (BUG-002).
          function Write-Lf([string]$path, [string[]]$lines) {
            [IO.File]::WriteAllText((Join-Path (Get-Location) $path), (($lines -join "`n") + "`n"), [Text.Encoding]::ASCII)
          }
          $pkg = "dist/$env:PACKAGE_NAME"
          New-Item -ItemType Directory -Force $pkg | Out-Null
          foreach ($exe in 'kindora-agent.exe', 'kindora-helper.exe') {
            $src = "target/release/$exe"
            if (-not (Test-Path $src)) { throw "Beklenen EXE yok: $src" }
            Copy-Item $src $pkg
          }
          Copy-Item packaging/p1a/README-TEST-TR.md $pkg
          $info = @(
            "Kindora P1A Windows test paketi - NOT FOR PRODUCTION"
            "commit=$env:GITHUB_SHA"
            "ref=$env:GITHUB_REF"
            "workflow_run=$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"
            "target=x86_64-pc-windows-msvc"
            "rust=$env:RUST_TOOLCHAIN"
            "runner=windows-2022"
          )
          Write-Lf "$pkg/BUILD-INFO.txt" $info
          $sums = Get-ChildItem $pkg -File | Sort-Object Name | ForEach-Object {
            "{0}  {1}" -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower(), $_.Name
          }
          Write-Lf "$pkg/SHA256SUMS.txt" $sums
          $zip = "dist/$env:PACKAGE_NAME.zip"
          Compress-Archive -Path "$pkg/*" -DestinationPath $zip -Force
          $zipHash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          Write-Lf "$zip.sha256" @("$zipHash  $env:PACKAGE_NAME.zip")
          Get-ChildItem $pkg -File | Format-Table Name, Length
          Get-Content "$pkg/SHA256SUMS.txt"
          Get-Content "$zip.sha256"

      - name: Paket içeriğini doğrula
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $check = "dist/verify"
          Expand-Archive "dist/$env:PACKAGE_NAME.zip" -DestinationPath $check -Force
          $expected = @('BUILD-INFO.txt', 'README-TEST-TR.md', 'SHA256SUMS.txt', 'kindora-agent.exe', 'kindora-helper.exe')
          $actual = (Get-ChildItem $check -File | Sort-Object Name).Name
          if (Compare-Object $expected $actual) { throw "Beklenmeyen paket içeriği: $($actual -join ', ')" }
          if ((Get-Content -Raw "$check/SHA256SUMS.txt") -match "`r") { throw "SHA256SUMS.txt CRLF içeriyor" }
          if ((Get-Content -Raw "dist/$env:PACKAGE_NAME.zip.sha256") -match "`r") { throw ".sha256 CRLF içeriyor" }
          foreach ($line in Get-Content "$check/SHA256SUMS.txt") {
            $hash, $name = $line -split '  ', 2
            $got = (Get-FileHash "$check/$name" -Algorithm SHA256).Hash.ToLower()
            if ($got -ne $hash) { throw "SHA-256 uyuşmazlığı: $name" }
          }
          & "$check/kindora-agent.exe"; if ($LASTEXITCODE -ne 2) { throw "agent kullanım çıktısı beklenmiyordu: $LASTEXITCODE" }
          & "$check/kindora-helper.exe"; if ($LASTEXITCODE -ne 2) { throw "helper kullanım çıktısı beklenmiyordu: $LASTEXITCODE" }
          $global:LASTEXITCODE = 0
          "Paket doğrulandı."

      - name: Artifact yükle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ env.PACKAGE_NAME }}
          path: |
            dist/${{ env.PACKAGE_NAME }}.zip
            dist/${{ env.PACKAGE_NAME }}.zip.sha256
            dist/ci-test-summary.txt
          if-no-files-found: error
          retention-days: 30

  prerelease:
    name: Prerelease (yalnız elle tetiklenince)
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.publish_prerelease && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Aynı çalıştırmanın artifact'ını indir
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ env.PACKAGE_NAME }}
          path: dist

      - name: SHA-256 doğrula
        working-directory: dist
        run: |
          sha256sum -c "$PACKAGE_NAME.zip.sha256"
          unzip -o -q "$PACKAGE_NAME.zip" -d pkg
          (cd pkg && sha256sum -c SHA256SUMS.txt)

      - name: Sürüm notları
        env:
          TAG: ${{ inputs.release_tag }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if ! [[ "$TAG" =~ ^p1a-windows-test\.[0-9]+$ ]]; then echo "Geçersiz etiket: $TAG"; exit 1; fi
          {
            echo "## ⚠️ Prerelease — Not for Production"
            echo
            echo "Kindora **P1A** Windows IPC ve servis yaşam döngüsü prototipi. **Kindora kullanım kilidi içermez.** Gerçek cihaz kabul testleri için hazırlanmıştır."
            echo
            echo "- **Commit:** \`$GITHUB_SHA\`"
            echo "- **Hedef:** \`x86_64-pc-windows-msvc\` (Windows x64), Rust $RUST_TOOLCHAIN, runner \`windows-2022\`"
            echo "- **CI çalıştırması:** $RUN_URL (bu dosyalar bu çalıştırmada derlendi ve test edildi)"
            echo
            echo "### Paket içeriği"
            echo "\`kindora-agent.exe\`, \`kindora-helper.exe\`, \`README-TEST-TR.md\`, \`BUILD-INFO.txt\`, \`SHA256SUMS.txt\`"
            echo
            echo "### SHA-256"
            echo '```'
            cat "dist/$PACKAGE_NAME.zip.sha256"
            cat dist/pkg/SHA256SUMS.txt
            echo '```'
            echo
            echo "### Geçen otomatik testler (GitHub-hosted Windows Server runner)"
            echo '```'
            grep -E "^test result:|MEASURE |LOCALSERVICE " dist/ci-test-summary.txt | tr -d '\r' || true
            echo '```'
            echo "Ayrıca: \`cargo fmt --check\`, \`cargo check\`, \`cargo clippy -D warnings\`, release derleme, release EXE'lerle **LocalService servis uçtan uca testi** (BUG-003), paket içeriği ve hash doğrulaması."
            echo
            echo "### Çalıştırılmayan gerçek cihaz testleri"
            echo "Gerçek Windows 11 cihazında W-01…W-12 henüz çalıştırılmadı. CI LocalService servis testini yönetici runner hesabıyla yaptı; yönetici olmayan PowerShell'den bağlantı (W-03), \`sc stop\` reddi (W-08), Görev Yöneticisi (W-09), servis durdurma/yeniden bağlanma (W-11), W-05/W-12 cihazda doğrulanmalı. CI, Windows 11 Home/Pro etkileşimli oturum kabul testinin yerine geçmez."
            echo
            echo "### Bilinen güvenlik sınırlamaları"
            echo "- EXE'ler imzasız; SmartScreen uyarısı beklenir — önce SHA-256 doğrulayın."
            echo "- Pipe erişimi Interactive Users grubuna açık (oturum logon SID'i yerine); oturum + exe adı/dizini denetimiyle sınırlı (ADR-0011)."
            echo "- Helper, pipe sunucusunun Kindora servisi olduğunu henüz doğrulamaz."
            echo "- Tekrar mesaj kimliği tespiti bağlantı başına ve bellekte."
            echo "- Helper, LocalService hesabına kendi sürecinde yalnız \`PROCESS_QUERY_LIMITED_INFORMATION\` izni verir (BUG-003); bu izin tüm LocalService servislerine açıktır (ADR-0006)."
            echo
            echo "### Test talimatları"
            echo "Paketteki \`README-TEST-TR.md\` dosyasını adım adım izleyin. Hiçbir şey otomatik kurulmaz veya açılışta başlamaz."
          } > notes.md
          cat notes.md

      - name: Prerelease oluştur
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release_tag }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Etiket zaten var ($TAG); üzerine yazılmaz."
            exit 1
          fi
          gh release create "$TAG" \
            "dist/$PACKAGE_NAME.zip" \
            "dist/$PACKAGE_NAME.zip.sha256" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Kindora P1A Windows Test ($TAG) — Not for Production" \
            --notes-file notes.md \
            --prerelease \
            --latest=false
