# Kindora P1D — masaüstünden bağımsız arka plan Session Helper'ı ve oturum
# açılışı görevi: derleme, test (P1A/P1B/P1C regresyonu dahil), gerçek
# LocalService servisiyle uçtan uca (P1A-C betiği) + paketteki kurulum/kaldırma
# betikleriyle arka plan ölçümü (P1D betiği), test paketi ve isteğe bağlı
# prerelease.
#
# - push (main): tüm denetimler + paket → yalnız Actions artifact.
# - workflow_dispatch + publish_prerelease: AYNI çalıştırmanın doğrulanmış
#   artifact'ı prerelease olarak yayımlanır (yeniden derleme yok).
# - Yalnız GitHub'ın resmi eylemleri, commit SHA ile sabit.
# - GitHub-hosted runner, Windows 11 Home/Pro etkileşimli kullanıcı kabulü DEĞİLDİR.

name: windows-p1d

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish_prerelease:
        description: "Başarılı derlemenin paketini prerelease olarak yayımla (Not for Production)"
        type: boolean
        default: false
      release_tag:
        description: "Prerelease etiketi (biçim: p1d-windows-test.N)"
        type: string
        default: "p1d-windows-test.1"

permissions:
  contents: read

concurrency:
  group: windows-p1d-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: "1.94.0"
  NODE_VERSION: "24"
  PACKAGE_NAME: Kindora-P1D-Windows-x64
  DESKTOP_DIR: apps/desktop

jobs:
  build:
    name: Windows x64 — desktop + agent, test, package
    runs-on: windows-2022
    timeout-minutes: 75
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Rust toolchain (rustup, sabit sürüm)
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component clippy,rustfmt --target x86_64-pc-windows-msvc
          rustup default "$RUST_TOOLCHAIN"
          rustc -V

      - name: Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Runner ortamı
        shell: pwsh
        run: |
          Get-CimInstance Win32_OperatingSystem | Select-Object Caption, Version, OSArchitecture | Format-List
          whoami
          "SessionId: $((Get-Process -Id $PID).SessionId)"
          node -v; npm -v
          $wv = Get-ItemProperty 'HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}' -ErrorAction SilentlyContinue
          "WebView2 Runtime: $($wv.pv)"

      # ── Agent / helper (kök Rust workspace) — P1A regresyonu dahil ─────────
      - name: Rust workspace — fmt, build, test, clippy
        run: |
          mkdir -p dist
          cargo fmt --all -- --check
          cargo build --workspace --locked
          cargo test --workspace --locked -- --nocapture 2>&1 | tee dist/test-output.txt
          cargo clippy --workspace --all-targets --locked -- -D warnings
          grep -E "^test result:|MEASURE " dist/test-output.txt > dist/ci-test-summary.txt

      - name: Release build (agent, helper)
        run: cargo build --release --workspace --locked

      # ── Masaüstü ön yüzü ────────────────────────────────────────────────
      - name: Frontend — npm ci, format, lint, typecheck, test, build
        working-directory: ${{ env.DESKTOP_DIR }}
        run: |
          npm ci --no-audit --no-fund
          npm run format:check
          npm run lint
          npm run typecheck
          npm run test 2>&1 | tee -a ../../dist/frontend-test-output.txt
          npm run build
          grep -E "Test Files|Tests " ../../dist/frontend-test-output.txt | sed 's/^/FRONTEND /' >> ../../dist/ci-test-summary.txt

      - name: Desktop Rust — fmt, clippy, test
        working-directory: ${{ env.DESKTOP_DIR }}/src-tauri
        run: |
          cargo fmt -- --check
          cargo clippy --all-targets --locked -- -D warnings
          cargo test --locked 2>&1 | tee ../../../dist/desktop-test-output.txt
          grep -E "^test result:" ../../../dist/desktop-test-output.txt | sed 's/^/DESKTOP /' >> ../../../dist/ci-test-summary.txt

      - name: Tauri Windows bundle (release EXE + NSIS)
        working-directory: ${{ env.DESKTOP_DIR }}
        run: |
          npm run tauri -- build --ci --bundles nsis -- --locked
          ls -la src-tauri/target/release/kindora-desktop.exe
          ls -la src-tauri/target/release/bundle/nsis/

      # P1A-C regresyonu: gerçek LocalService servisi + köprü + Tauri penceresi.
      - name: LocalService uçtan uca + kullanım süresi + masaüstü duman testi (P1A-C regresyonu)
        shell: pwsh
        run: |
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File ci/p1a-localservice-e2e.ps1 -BinDir target/release -SummaryFile dist/ci-test-summary.txt -DesktopExe "$env:DESKTOP_DIR/src-tauri/target/release/kindora-desktop.exe" -ScreenTime
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Paketle ve SHA-256
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          function Write-Lf([string]$path, [string[]]$lines) {
            [IO.File]::WriteAllText((Join-Path (Get-Location) $path), (($lines -join "`n") + "`n"), [Text.Encoding]::ASCII)
          }
          $pkg = "dist/$env:PACKAGE_NAME"
          New-Item -ItemType Directory -Force $pkg | Out-Null
          Copy-Item "$env:DESKTOP_DIR/src-tauri/target/release/kindora-desktop.exe" $pkg
          foreach ($exe in 'kindora-agent.exe', 'kindora-helper.exe') { Copy-Item "target/release/$exe" $pkg }
          Copy-Item packaging/p1d/README-TEST-TR.md, packaging/p1d/install-kindora-test.ps1, packaging/p1d/uninstall-kindora-test.ps1, packaging/p1d/status-kindora-test.ps1 $pkg
          foreach ($ps in Get-ChildItem "$pkg/*.ps1") {
            if (@([IO.File]::ReadAllBytes($ps.FullName) | Where-Object { $_ -gt 127 }).Count -gt 0) { throw "$($ps.Name) ASCII değil (PowerShell 5.1)" }
          }
          Write-Lf "$pkg/BUILD-INFO.txt" @(
            "Kindora P1D Windows test paketi - NOT FOR PRODUCTION"
            "commit=$env:GITHUB_SHA"
            "ref=$env:GITHUB_REF"
            "workflow_run=$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"
            "target=x86_64-pc-windows-msvc"
            "rust=$env:RUST_TOOLCHAIN"
            "node=$(node -v)"
            "runner=windows-2022"
          )
          $sums = Get-ChildItem $pkg -File | Sort-Object Name | ForEach-Object {
            "{0}  {1}" -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower(), $_.Name
          }
          Write-Lf "$pkg/SHA256SUMS.txt" $sums
          $zip = "dist/$env:PACKAGE_NAME.zip"
          Compress-Archive -Path "$pkg/*" -DestinationPath $zip -Force
          $zipHash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          Write-Lf "$zip.sha256" @("$zipHash  $env:PACKAGE_NAME.zip")
          Get-ChildItem $pkg -File | Format-Table Name, Length
          Get-Content "$pkg/SHA256SUMS.txt"
          Get-Content "$zip.sha256"

      # Paketteki kurulum/kaldırma betikleriyle bağımsız arka plan helper'ı.
      - name: Arka plan helper'ı uçtan uca (paket betikleriyle, P1D)
        shell: pwsh
        run: |
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File ci/p1d-background-e2e.ps1 -PackageDir "dist/$env:PACKAGE_NAME" -SummaryFile dist/ci-test-summary.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # P1D.1: Lenovo D-05 senaryosu — varsayılan 5 dk yeniden denetimle, gerçek
      # zaman tetikleyicisinin helper'ı yeniden başlattığı Görev Zamanlayıcısı
      # olay kayıtlarıyla kanıtlanır (elle başlatma sayılmaz).
      - name: Helper kurtarma — gerçek zamanlanmış tetikleyici (P1D.1, D-05)
        shell: pwsh
        run: |
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File ci/p1d-recovery-e2e.ps1 -PackageDir "dist/$env:PACKAGE_NAME" -SummaryFile dist/ci-test-summary.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Paket içeriğini doğrula
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $check = "dist/verify"
          Expand-Archive "dist/$env:PACKAGE_NAME.zip" -DestinationPath $check -Force
          $expected = @('BUILD-INFO.txt', 'README-TEST-TR.md', 'SHA256SUMS.txt', 'install-kindora-test.ps1', 'kindora-agent.exe', 'kindora-desktop.exe', 'kindora-helper.exe', 'status-kindora-test.ps1', 'uninstall-kindora-test.ps1')
          $actual = (Get-ChildItem $check -File | Sort-Object Name).Name
          if (Compare-Object $expected $actual) { throw "Beklenmeyen paket içeriği: $($actual -join ', ')" }
          foreach ($f in "$check/SHA256SUMS.txt", "dist/$env:PACKAGE_NAME.zip.sha256") {
            if ((Get-Content -Raw $f) -match "`r") { throw "$f CRLF içeriyor (BUG-002)" }
          }
          foreach ($line in Get-Content "$check/SHA256SUMS.txt") {
            $hash, $name = $line -split '  ', 2
            if ((Get-FileHash "$check/$name" -Algorithm SHA256).Hash.ToLower() -ne $hash) { throw "SHA-256 uyuşmazlığı: $name" }
          }
          & "$check/kindora-agent.exe"; if ($LASTEXITCODE -ne 2) { throw "agent kullanım çıktısı beklenmiyordu: $LASTEXITCODE" }
          & "$check/kindora-helper.exe"; if ($LASTEXITCODE -ne 2) { throw "helper kullanım çıktısı beklenmiyordu: $LASTEXITCODE" }
          $global:LASTEXITCODE = 0
          "Paket doğrulandı."

      - name: Artifact yükle (test paketi)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ env.PACKAGE_NAME }}
          path: |
            dist/${{ env.PACKAGE_NAME }}.zip
            dist/${{ env.PACKAGE_NAME }}.zip.sha256
            dist/ci-test-summary.txt
          if-no-files-found: error
          retention-days: 30

      # NSIS kurucusu yalnız paketlemenin çalıştığını doğrular; prerelease'e konmaz
      # (agent/helper içermez, servis kurmaz). Bkz. ADR-0013.
      - name: Artifact yükle (NSIS kurucu — yalnız CI doğrulaması)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Kindora-P1D-NSIS-ci-only
          path: ${{ env.DESKTOP_DIR }}/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 7

  prerelease:
    name: Prerelease (yalnız elle tetiklenince)
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.publish_prerelease && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Aynı çalıştırmanın artifact'ını indir
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ env.PACKAGE_NAME }}
          path: dist

      - name: SHA-256 doğrula
        working-directory: dist
        run: |
          sha256sum -c "$PACKAGE_NAME.zip.sha256"
          unzip -o -q "$PACKAGE_NAME.zip" -d pkg
          (cd pkg && sha256sum -c SHA256SUMS.txt)

      - name: Sürüm notları
        env:
          TAG: ${{ inputs.release_tag }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if ! [[ "$TAG" =~ ^p1d-windows-test\.[0-9]+$ ]]; then echo "Geçersiz etiket: $TAG"; exit 1; fi
          {
            echo "## ⚠️ Prerelease — Not for Production"
            echo
            echo "Kindora **P1D** bağımsız arka plan Session Helper'ı: kullanım süresi masaüstü penceresi kapalıyken de ölçülür. Helper, isteğe bağlı (açık onayla kurulan) kullanıcı başına Zamanlanmış Görev ile oturum açılışında yönetici yetkisi olmadan başlar; agent aynı anda tek raporlayıcı kabul eder. **Kilit, engelleme, program kapatma veya erişim kısıtlaması içermez.**"
            echo
            echo "- **Commit:** \`$GITHUB_SHA\`"
            echo "- **Hedef:** Windows x64, Rust $RUST_TOOLCHAIN, Node $NODE_VERSION, runner \`windows-2022\`"
            echo "- **CI çalıştırması:** $RUN_URL (dosyalar bu çalıştırmada derlendi ve test edildi)"
            echo
            echo "### Paket içeriği"
            echo "\`kindora-desktop.exe\`, \`kindora-agent.exe\`, \`kindora-helper.exe\`, \`install-kindora-test.ps1\`, \`uninstall-kindora-test.ps1\`, \`status-kindora-test.ps1\`, \`README-TEST-TR.md\`, \`BUILD-INFO.txt\`, \`SHA256SUMS.txt\`. Betikler yalnız Kindora kayıtlarını değiştirir, kendini yönetici yetkisine yükseltmez ve verileri yalnız açık onayla siler."
            echo
            echo "### SHA-256"
            echo '```'
            cat "dist/$PACKAGE_NAME.zip.sha256"
            cat dist/pkg/SHA256SUMS.txt
            echo '```'
            echo
            echo "### Geçen otomatik testler (GitHub-hosted Windows Server runner)"
            echo '```'
            grep -E "^test result:|MEASURE |LOCALSERVICE |SCREENTIME |P1D |P1D1 |FRONTEND |DESKTOP " dist/ci-test-summary.txt | tr -d '\r' || true
            echo '```'
            echo
            echo "### Sınırlamalar"
            echo "- Gerçek Windows 11 cihazında arka plan ölçümü kabulü **yapılmadı**; CI'da gerçek oturum açılışı, oturum kapatma, kullanıcı değiştirme, Windows yeniden başlatma ve uyku yoktur (görev elle tetiklendi)."
            echo "- Kurallar test varsayılanları veya DEV test dosyasıdır; ebeveyn yetkilendirmesi henüz yoktur."
            echo "- EXE'ler imzasız; SmartScreen uyarısı beklenir — önce SHA-256 doğrulayın."
            echo "- Taşınabilir paket; kurucu (installer) bu sürümde dağıtılmaz. Kurulum paketteki PowerShell betikleriyle yapılır."
            echo "- Hesap yönetici ise Kindora yöneticiye karşı değiştirilemez bir kilit sağlayamaz (ADR-0012)."
            echo
            echo "### Test talimatları"
            echo "Paketteki \`README-TEST-TR.md\` dosyasını izleyin."
          } > notes.md
          cat notes.md

      - name: Prerelease oluştur
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release_tag }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Etiket zaten var ($TAG); üzerine yazılmaz."
            exit 1
          fi
          gh release create "$TAG" \
            "dist/$PACKAGE_NAME.zip" \
            "dist/$PACKAGE_NAME.zip.sha256" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Kindora P1D Windows Test ($TAG) — Not for Production" \
            --notes-file notes.md \
            --prerelease \
            --latest=false
